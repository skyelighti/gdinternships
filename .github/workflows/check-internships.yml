name: Check internship listings

on:
  schedule:
    # 13:00 UTC daily (~9am ET / 6am PT)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run internship checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: node scripts/check-internships.mjs

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "gdinternships-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/internships.json
          git diff --cached --quiet || git commit -m "chore: update internship status [automated]"
          git push
