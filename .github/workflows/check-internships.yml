name: Check internship listings

on:
  schedule:
    # Scan every 20 minutes. Offsetting from the top of the hour reduces the
    # chance of GitHub's busiest scheduled-workflow window delaying a run.
    - cron: "7,27,47 * * * *"
    # Keep one daily recap around 9pm ET without emailing after every scan.
    - cron: "13 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: internship-listing-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run internship checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/check-internships.mjs

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "gdinternships-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/internships.json
          git diff --cached --quiet || git commit -m "chore: update internship status [automated]"
          git push
