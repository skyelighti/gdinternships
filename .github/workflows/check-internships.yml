name: Check internship listings

on:
  schedule:
    # Twice daily, 12h apart: 13:00 UTC (~9am ET) and 01:00 UTC (~9pm ET).
    # The 01:00 UTC run is the "second refresh of the day" — if it finds no
    # newly-opened listings, it sends a recap instead of staying silent.
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run internship checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/check-internships.mjs

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "gdinternships-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/internships.json
          git diff --cached --quiet || git commit -m "chore: update internship status [automated]"
          git push
