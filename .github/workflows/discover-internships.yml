name: Discover new internship listings

on:
  schedule:
    # 12:00 UTC every Monday
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run discovery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: node scripts/discover.mjs

      - name: Commit discovered listings
        if: always()
        run: |
          git config user.name "gdinternships-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/internships.json
          git diff --cached --quiet || git commit -m "chore: add newly discovered listings [automated]"
          git push
